
services:
  laravel:
    image: farameet-laravel-staging:latest
    container_name: farameet-laravel-staging
    ports:
      - "127.0.0.1:8081:8000"
    env_file:
      - /var/www/laravel-staging/.env
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    volumes:
      - /var/www/laravel-staging/database/database.sqlite:/var/www/html/database/database.sqlite
      - /var/www/laravel-staging/storage:/var/www/html/storage
    restart: unless-stopped
