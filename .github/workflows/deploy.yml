
      - name: Upload website
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -eu

          scp \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            site/index.html \
            "$SERVER_USER@$SERVER_HOST:/tmp/farameet-index.html"

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" \
            'sudo -n /usr/local/sbin/deploy-server-farameet'
