name: Deploy server.farameet.ir

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server-farameet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Validate website HTML
        run: |
          test -f site/index.html
          ! grep -qE '^[[:space:]]*```' site/index.html
          grep -qi '<html' site/index.html
          grep -qi '</html>' site/index.html

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" \
            'whoami'

      - name: Upload website
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            site/index.html \
            "$SERVER_USER@$SERVER_HOST:/tmp/farameet-index.html"

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" \
            'sudo install -o www-data -g www-data -m 644 /tmp/farameet-index.html /var/www/server.farameet.ir/index.html && rm -f /tmp/farameet-index.html'