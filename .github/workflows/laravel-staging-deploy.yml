
name: Deploy Laravel Docker to staging

on:
  push:
    branches:
      - main
    paths:
      - "laravel-app/**"
      - "compose.staging.yaml"
      - ".github/workflows/laravel-staging-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          test -n "$SERVER_HOST"
          test -n "$SERVER_SSH_KEY_B64"

          printf '%s' "$SERVER_SSH_KEY_B64" \
            | base64 --decode > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          ssh-keyscan -H "$SERVER_HOST" \
            >> ~/.ssh/known_hosts 2>/dev/null

          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -eu

          test -n "$SERVER_USER"

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" 'whoami'

      - name: Build Docker image
        run: |
          set -eu

          docker build \
            --pull \
            -t farameet-laravel-staging:latest \
            -f laravel-app/Dockerfile \
            laravel-app

          docker save farameet-laravel-staging:latest \
            | gzip -1 > /tmp/farameet-laravel-staging.tar.gz

      - name: Transfer image and Compose configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -eu

          scp -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            /tmp/farameet-laravel-staging.tar.gz \
            "$SERVER_USER@$SERVER_HOST:/tmp/farameet-laravel-staging.tar.gz"

          scp -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            compose.staging.yaml \
            "$SERVER_USER@$SERVER_HOST:/tmp/compose.staging.yaml"

      - name: Deploy container to staging
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -eu

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" \
            'sudo /usr/local/sbin/deploy-laravel-staging'

      - name: Verify staging HTTP response
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -eu

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -eu

          URL=http://127.0.0.1:8081/

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              "$URL" -o /dev/null; then
              echo "Laravel Docker staging returned HTTP success."
              exit 0
            fi

            sleep 2
          done

          echo "Staging health check failed."
          exit 1
          REMOTE
